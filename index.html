<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14254a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Asistencia">
  <title>Registro de Asistencia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-muted: #f6f7fa;
      --text: #111827;
      --muted: #667085;
      --border: #d9deea;
      --primary: #14254a;
      --primary-dark: #0e1a35;
      --primary-soft: #e7ecf7;
      --danger: #b42318;
      --shadow: 0 18px 48px rgba(20, 37, 74, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        linear-gradient(140deg, rgba(20, 37, 74, 0.12), transparent 34%),
        linear-gradient(320deg, rgba(52, 84, 145, 0.10), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .app-shell {
      width: min(100%, 460px);
      min-height: min(760px, calc(100vh - 36px));
      min-height: min(760px, calc(100dvh - 36px));
      background: var(--surface);
      border: 1px solid rgba(217, 225, 222, 0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 22px 22px 18px;
      background: linear-gradient(180deg, #ffffff, #f8fbfa);
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      display: block;
      border-radius: 14px;
      object-fit: cover;
      background: var(--primary);
      box-shadow: 0 10px 22px rgba(20, 37, 74, 0.18);
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .form-body {
      flex: 1;
      padding: 20px 22px;
      overflow-y: auto;
    }

    .install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #b7e2d6;
      border-radius: 12px;
      background: var(--primary-soft);
    }

    .install-banner p {
      margin: 0;
      color: var(--primary-dark);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .btn-install {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .scanner-panel {
      display: none;
      margin-bottom: 18px;
      border-radius: 16px;
      overflow: hidden;
      background: #050807;
      border: 1px solid #0b1210;
    }

    #reader {
      width: 100%;
      min-height: 300px;
    }

    #reader video {
      object-fit: cover;
    }

    .scan-status {
      display: none;
      margin: -4px 0 14px;
      color: var(--primary-dark);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #3c4743;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      min-height: 54px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      overflow: hidden;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .input-row:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(20, 37, 74, 0.12);
    }

    .input-row input,
    .readonly-input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
    }

    .input-row input {
      padding: 0 14px;
      text-transform: uppercase;
    }

    .scan-button {
      width: 52px;
      border: 0;
      border-left: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--primary-dark);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .scan-button.is-active {
      background: #fee4e2;
      color: var(--danger);
    }

    .hint-text {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.35;
    }

    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .readonly-field {
      min-height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-muted);
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 18px max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
    }

    .btn-footer {
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
    }

    .btn-footer:active {
      transform: translateY(1px);
    }

    .btn-cancel {
      background: #edf1ef;
      color: #3f4a46;
    }

    .btn-save {
      background: var(--primary);
      color: white;
    }

    .btn-save:disabled {
      opacity: 0.58;
      cursor: wait;
    }

    @media (max-width: 520px) {
      .page {
        display: block;
        padding: 0;
      }

      .app-shell {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="app-shell" aria-label="Registro de asistencia">
      <header class="header">
        <div class="brand-row">
          <img class="brand-logo" src="logo-Naciones.jpg" alt="Naciones">
          <div class="brand-copy">
            <p class="eyebrow">Control de entrada</p>
            <h1 class="title">Registro de asistencia</h1>
            <p class="subtitle">Escanea el QR o captura el ID manualmente.</p>
          </div>
        </div>
      </header>

      <div class="form-body">
        <div class="install-banner" id="installBanner">
          <p>Instala la app para abrirla mas rapido desde tu celular.</p>
          <button class="btn-install" id="installBtn" type="button">Instalar</button>
        </div>

        <div class="scanner-panel" id="scannerPanel">
          <div id="reader"></div>
        </div>
        <p class="scan-status" id="scanStatus">Camara activa. Acerca el codigo al recuadro.</p>

        <div class="form-group">
          <label class="field-label" for="id_escaneado">ID escaneado</label>
          <div class="input-row">
            <input
              type="text"
              id="id_escaneado"
              autocomplete="off"
              inputmode="text"
              placeholder="Escribe o escanea el ID"
            >
            <button class="scan-button" onclick="toggleScanner()" id="scanBtn" type="button" aria-label="Activar escaner">□</button>
          </div>
          <p class="hint-text">Usa buena luz y centra el QR.</p>
        </div>

        <div class="date-grid">
          <div class="form-group">
            <label class="field-label" for="fecha">Fecha</label>
            <div class="readonly-field">
              <input type="text" id="fecha" class="readonly-input" readonly>
            </div>
          </div>
          <div class="form-group">
            <label class="field-label" for="hora">Hora</label>
            <div class="readonly-field">
              <input type="text" id="hora" class="readonly-input" readonly>
            </div>
          </div>
        </div>
      </div>

      <footer class="footer">
        <button class="btn-footer btn-cancel" onclick="resetApp()" type="button">Limpiar</button>
        <button class="btn-footer btn-save" id="saveBtn" onclick="guardar()" type="button">Guardar</button>
      </footer>
    </section>
  </main>

  <script>
    const WEBAPP_URL = 'https://script.google.com/a/macros/naciones.org.mx/s/AKfycbwK3UPhNEuexvO1nRk2nBIZmVqzaDRfaPQLbiLVyp1uuoWVYqrfvtOcV8fjEeZDhpZ5/exec';
    const APP_VERSION = '2026.09.17.2';
    const INVALID_TEMPLATE_RE = /^\{[^}]*\}$/;

    let audioCtx = null;
    let deferredPrompt = null;
    let html5QrCode = null;
    let scannerStarting = false;

    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      return audioCtx;
    }

    function playSound(type) {
      const ctx = getAudioCtx();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'scan') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.12);
      } else if (type === 'success') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.10);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.28);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.35);
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(`sw.js?v=${APP_VERSION}`).then((registration) => {
        registration.update().catch(console.error);
      }).catch(console.error);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').style.display = 'flex';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') document.getElementById('installBanner').style.display = 'none';
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('installBanner').style.display = 'none';
    });

    function updateDateTime() {
      const ahora = new Date();
      document.getElementById('fecha').value = ahora.toLocaleDateString('es-MX');
      document.getElementById('hora').value = ahora.toLocaleTimeString('es-MX', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    window.addEventListener('load', () => {
      updateDateTime();
      setInterval(updateDateTime, 1000);
    });

    function normalizeId(value) {
      return value.trim().replace(/\s+/g, '').toUpperCase();
    }

    function isInvalidId(value) {
      if (!value) return 'Escanea un codigo o escribe el ID primero.';
      if (value === '{ID}' || INVALID_TEMPLATE_RE.test(value) || /[{}]/.test(value)) {
        return 'El QR contiene una plantilla como {ID}, no un ID real.';
      }
      if (value.length < 2) return 'El ID escaneado es demasiado corto.';
      return '';
    }

    function getQrboxSize(viewfinderWidth, viewfinderHeight) {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const size = Math.max(220, Math.min(320, Math.floor(minEdge * 0.78)));
      return { width: size, height: size };
    }

    function setScannerUi(active) {
      document.getElementById('scannerPanel').style.display = active ? 'block' : 'none';
      document.getElementById('scanStatus').style.display = active ? 'block' : 'none';
      const scanBtn = document.getElementById('scanBtn');
      scanBtn.textContent = active ? '×' : '□';
      scanBtn.classList.toggle('is-active', active);
      scanBtn.setAttribute('aria-label', active ? 'Detener escaner' : 'Activar escaner');
    }

    function toggleScanner() {
      if (scannerStarting) return;
      if (html5QrCode && html5QrCode.isScanning) {
        detenerCamara();
      } else {
        iniciarCamara();
      }
    }

    async function iniciarCamara() {
      if (!window.Html5Qrcode) {
        Swal.fire('Escaner no disponible', 'No se pudo cargar la libreria del escaner. Verifica tu conexion.', 'error');
        return;
      }

      scannerStarting = true;
      setScannerUi(true);
      html5QrCode = new Html5Qrcode('reader', {
        formatsToSupport: window.Html5QrcodeSupportedFormats ? [Html5QrcodeSupportedFormats.QR_CODE] : undefined
      });

      const config = {
        fps: 15,
        qrbox: getQrboxSize,
        aspectRatio: 1,
        disableFlip: false
      };

      try {
        await html5QrCode.start(
          { facingMode: 'environment' },
          config,
          (decodedText) => {
            const scannedId = normalizeId(decodedText);
            const invalidReason = isInvalidId(scannedId);

            if (invalidReason) {
              playSound('error');
              Swal.fire('Codigo invalido', invalidReason, 'warning');
              return;
            }

            document.getElementById('id_escaneado').value = scannedId;
            detenerCamara();
            playSound('scan');
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: 'Codigo escaneado',
              showConfirmButton: false,
              timer: 1300
            });
          }
        );
      } catch (err) {
        console.error('Error de camara:', err);
        Swal.fire('Error de camara', 'Verifica que diste permiso de camara al navegador.', 'error');
        html5QrCode = null;
        setScannerUi(false);
      } finally {
        scannerStarting = false;
      }
    }

    async function detenerCamara() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          await html5QrCode.clear();
        } catch (e) {
          console.log('Error al detener:', e);
        }
        html5QrCode = null;
      }
      document.getElementById('reader').innerHTML = '';
      setScannerUi(false);
    }

    function resetApp() {
      document.getElementById('id_escaneado').value = '';
      document.getElementById('saveBtn').disabled = false;
      detenerCamara();
      updateDateTime();
    }

    async function guardar() {
      const input = document.getElementById('id_escaneado');
      const saveBtn = document.getElementById('saveBtn');
      const val = normalizeId(input.value);
      const invalidReason = isInvalidId(val);

      input.value = val;

      if (invalidReason) {
        playSound('error');
        return Swal.fire('ID invalido', invalidReason, 'warning');
      }

      saveBtn.disabled = true;
      Swal.fire({
        title: 'Guardando...',
        text: 'Registrando asistencia',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const params = new URLSearchParams({ action: 'registrarAsistencia', id_escaneado: val });
        const url = `${WEBAPP_URL}?${params.toString()}`;

        await fetch(url, {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-store',
          keepalive: true
        });

        playSound('success');
        Swal.fire('Listo', 'Asistencia registrada correctamente.', 'success').then(() => resetApp());
      } catch (err) {
        console.error('Error al guardar:', err);
        saveBtn.disabled = false;
        playSound('error');
        Swal.fire('Error de red', 'No se pudo conectar. Verifica tu conexion e intenta de nuevo.', 'error');
      }
    }
  </script>
</body>
</html>
